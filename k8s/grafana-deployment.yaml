apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: food-automation
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: food-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          ports:
            - containerPort: 3000
          volumeMounts:
            - mountPath: /etc/grafana/provisioning
              name: grafana-provisioning-storage
            - mountPath: /var/lib/grafana
              name: grafana-data-storage
      volumes:
        - name: grafana-provisioning-storage
          persistentVolumeClaim:
            claimName: grafana-provisioning-pv-claim
        - name: grafana-data-storage
          persistentVolumeClaim:
            claimName: grafana-data-pv-claim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-provisioning-pv-claim
  namespace: food-automation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pv-claim
  namespace: food-automation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
